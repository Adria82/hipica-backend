version: "3.9"

services:
  # -----------------------------------------------------------------------
  # Servicio API de FastAPI
  # -----------------------------------------------------------------------
  api:
    build: .
    ports:
      - "8000:8000"            # Exponer puerto local 8000
    env_file:
      - .env                   # Carga variables de entorno (.env)
    depends_on:
      - db                     # Espera a que PostgreSQL esté levantado
    volumes:
      - ./app:/app/app         # Monta el código para hot-reload en desarrollo

  # -----------------------------------------------------------------------
  # Servicio PostgreSQL
  # -----------------------------------------------------------------------
  db:
    image: postgres:15          # Imagen oficial de PostgreSQL
    restart: always             # Reinicia automáticamente si falla
    env_file:
      - .env                    # Carga credenciales desde .env
    ports:
      - "5432:5432"             # Puerto local de PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistencia de datos

# ---------------------------------------------------------------------------
# Volúmenes
# ---------------------------------------------------------------------------
volumes:
  postgres_data: