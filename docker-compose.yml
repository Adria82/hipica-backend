version: "3.9"

services:
  # -----------------------------------------------------------------------
  # Servicio API de FastAPI
  # -----------------------------------------------------------------------
  api:
    build: .
    ports:
      - "8000:8000"            # Exponer puerto local 8000
    env_file:
      - .env                   # Carga variables de entorno (.env)
    depends_on:
      db:
        condition: service_healthy   # Espera a que PostgreSQL acepte conexiones
    volumes:
      - ./app:/app/app         # Monta el código para hot-reload en desarrollo
    # Carga los datos de prueba solo si la BD está vacía y arranca la API
    command: >
      sh -c "PYTHONPATH=. python app/seed.py --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # -----------------------------------------------------------------------
  # Servicio PostgreSQL
  # -----------------------------------------------------------------------
  db:
    image: postgres:15          # Imagen oficial de PostgreSQL
    restart: always             # Reinicia automáticamente si falla
    env_file:
      - .env                    # Carga credenciales desde .env
    ports:
      - "5432:5432"             # Puerto local de PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistencia de datos
    healthcheck:                # Indica cuándo PostgreSQL está listo
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

# ---------------------------------------------------------------------------
# Volúmenes
# ---------------------------------------------------------------------------
volumes:
  postgres_data: