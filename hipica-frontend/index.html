<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon dinámico -->
    <link id="app-favicon" rel="icon" href="/branding/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título dinámico -->
    <title id="app-title">Cargando...</title>

    <script>
      function detectClient() {
        const params = new URLSearchParams(window.location.search);

        // Permitir override manual (solo para desarrollo)
        const forced = params.get("client");
        if (forced) {
          console.info("[Branding] Forced client:", forced);
          return forced;
        }

        // Detectar por subdominio en producción
        const host = window.location.hostname;

        if (host.includes("localhost") || host.startsWith("127.0.0.1")) {
          return "default";
        }

        const parts = host.split(".");
        return parts.length > 2 ? parts[0] : "default";
      }


      const client = detectClient();

      async function bootstrap() {
        try {
          const res = await fetch(`/branding/${client}/branding.json`);
          const branding = res.ok
            ? await res.json()
            : await fetch(`/branding/default/branding.json`).then(r => r.json());

          window.__APP_BRANDING__ = branding;

          document.title = branding.appName;

          const favicon = document.getElementById("app-favicon");
          favicon.href = `/branding/${client}/${branding.favicon}`;
        } catch (e) {
          console.warn("Branding load failed, continuing without branding.");
          window.__APP_BRANDING__ = {};
        }

        // SOLO ahora arrancamos Vue
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/main.ts";
        document.body.appendChild(script);
      }

      bootstrap();
    </script>


  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
